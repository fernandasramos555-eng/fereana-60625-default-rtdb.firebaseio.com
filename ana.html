<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Fumaça - ESP8266</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            min-width: 300px;
        }
        h1 { color: #333; }
        .valor {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }
        .status {
            font-size: 18px;
            padding: 12px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }
        /* Cores dos estados */
        .seguro { background-color: #5cb85c; }   /* Verde */
        .atencao { background-color: #f0ad4e; }  /* Laranja */
        .perigo { background-color: #d9534f; }   /* Vermelho */
    </style>
</head>
<body>

    <div class="card">
        <h1>Monitoramento de Fumaça</h1>
        <p>Nível atual capturado pelo ESP8266:</p>
        <div id="fumacaValor" class="valor">Carregando...</div>
        <div id="statusTexto" class="status seguro">A aguardar dados...</div>
    </div>

    <!-- Importação do Firebase versão compatível com web -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Configuração do seu Firebase
        const firebaseConfig = {
            databaseURL: "https://fereana-60625-default-rtdb.firebaseio.com/"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);

        // Referência para o caminho "/Dados/Fumaca" no banco de dados
        const dbRef = firebase.database().ref('Dados/Fumaca');

        const elementoValor = document.getElementById('fumacaValor');
        const elementoStatus = document.getElementById('statusTexto');

        // Função para gerar um sinal sonoro (beep) através do navegador
        let audioCtx = null;
        function tocarAlarme() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const oscilador = audioCtx.createOscillator();
            const ganho = audioCtx.createGain();

            oscilador.type = 'sine'; // Tipo de onda sonora
            oscilador.frequency.setValueAtTime(600, audioCtx.currentTime); // Frequência do som (agudo)

            oscilador.connect(ganho);
            ganho.connect(audioCtx.destination);

            oscilador.start();
            setTimeout(() => {
                oscilador.stop();
            }, 300); // O som toca por 300 milissegundos
        }

        // Escuta alterações no valor da fumaça em tempo real
        dbRef.on('value', (snapshot) => {
            const valor = snapshot.val();
            
            if (valor !== null) {
                elementoValor.innerText = valor;

                // Remove todas as classes de status anteriores
                elementoStatus.classList.remove('seguro', 'atencao', 'perigo');

                // Lógica de cores e alarme sonoro
                if (valor > 200) {
                    elementoStatus.innerText = "PERIGO: Nível de fumaça muito alto!";
                    elementoStatus.classList.add('perigo'); // Vermelho
                    tocarAlarme(); // Toca o alarme
                } else if (valor > 40) {
                    elementoStatus.innerText = "ATENÇÃO: Fumaça detetada!";
                    elementoStatus.classList.add('atencao'); // Laranja
                    tocarAlarme(); // Toca o alarme
                } else {
                    elementoStatus.innerText = "Ambiente Seguro (Normal)";
                    elementoStatus.classList.add('seguro'); // Verde
                }
            } else {
                elementoValor.innerText = "Sem dados";
                elementoStatus.innerText = "A aguardar dados...";
                elementoStatus.className = "status seguro";
            }
        });
    </script>

</body>
</html>
</body>
</html>
